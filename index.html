<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hans's Memory Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}

.header {
  text-align: center;
  margin-bottom: 16px;
  color: #fff;
}
.header h1 {
  font-size: 28px;
  font-weight: 800;
  text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  letter-spacing: -0.5px;
}
.header .subtitle {
  font-size: 14px;
  opacity: 0.8;
  margin-top: 4px;
}

.stats {
  display: flex;
  gap: 20px;
  margin-bottom: 16px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
}
.stats span { text-shadow: 0 1px 4px rgba(0,0,0,0.2); }

.board {
  display: grid;
  gap: 10px;
  perspective: 1000px;
  max-width: 500px;
  width: 100%;
}

.card {
  aspect-ratio: 1;
  cursor: pointer;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  -webkit-tap-highlight-color: transparent;
}
.card.flipped { transform: rotateY(180deg); }
.card.matched { transform: rotateY(180deg); }
.card.matched .card-front { box-shadow: 0 0 20px rgba(255,215,0,0.6); border-color: gold; }
.card.peek { transform: rotateY(180deg); }
.card.peek .card-front img { filter: blur(12px); transition: filter 0.3s; }
.card.peek.peek-clear .card-front img { filter: none; }

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid rgba(255,255,255,0.3);
}

.card-back {
  background: linear-gradient(145deg, #43e97b 0%, #38f9d7 100%);
  font-size: 32px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
.card-back::after {
  content: '?';
  font-size: 36px;
  font-weight: 800;
  color: rgba(255,255,255,0.5);
}

.card-front {
  background: rgba(255,255,255,0.95);
  transform: rotateY(180deg);
  font-size: 48px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
.card-front img {
  width: 85%;
  height: 85%;
  object-fit: cover;
  border-radius: 8px;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(8px);
  color: #fff;
  text-align: center;
  padding: 24px;
}
.overlay.hidden { display: none; }
.overlay h2 { font-size: 48px; margin-bottom: 8px; }
.overlay p { font-size: 18px; opacity: 0.9; margin-bottom: 24px; }
.overlay .timer-big {
  font-size: 96px;
  font-weight: 800;
  text-shadow: 0 4px 16px rgba(0,0,0,0.3);
  line-height: 1;
}

.btn {
  padding: 14px 32px;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  background: #fff;
  color: #764ba2;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  transition: transform 0.15s;
  margin: 6px;
}
.btn:active { transform: scale(0.95); }

.difficulty {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 16px;
}
.diff-btn {
  padding: 12px 20px;
  border: 3px solid rgba(255,255,255,0.4);
  border-radius: 12px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.diff-btn:hover, .diff-btn.active {
  background: rgba(255,255,255,0.3);
  border-color: #fff;
}

.peek-bar {
  width: 100%;
  max-width: 500px;
  height: 8px;
  background: rgba(255,255,255,0.2);
  border-radius: 4px;
  margin-bottom: 12px;
  overflow: hidden;
}
.peek-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #43e97b, #38f9d7);
  border-radius: 4px;
  transition: width 0.1s linear;
}

.confetti {
  position: fixed;
  top: -10px;
  width: 12px;
  height: 12px;
  border-radius: 2px;
  animation: fall linear forwards;
  z-index: 200;
  pointer-events: none;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

@media (max-width: 500px) {
  .header h1 { font-size: 22px; }
  .card-front { font-size: 36px; }
  .card-back::after { font-size: 28px; }
  .board { gap: 6px; }
}
</style>
</head>
<body>

<!-- Start Screen -->
<div class="overlay" id="startScreen">
  <h2>🧠</h2>
  <p>Hans's Memory Game</p>
  <div class="difficulty">
    <button class="diff-btn active" data-size="4">Easy (4×3)</button>
    <button class="diff-btn" data-size="6">Medium (4×4)</button>
    <button class="diff-btn" data-size="8">Hard (4×5)</button>
  </div>
  <div style="margin-top: 20px">
    <button class="btn" id="startBtn">▶ Start Game</button>
  </div>
</div>

<!-- Peek Countdown -->
<div class="overlay hidden" id="peekOverlay">
  <p style="font-size: 22px; font-weight: 700;">Get ready to memorize!</p>
  <div class="timer-big" id="peekTimer">5</div>
</div>

<!-- Win Screen -->
<div class="overlay hidden" id="winScreen">
  <h2>🎉</h2>
  <p id="winText">Amazing job!</p>
  <button class="btn" id="playAgainBtn">Play Again!</button>
</div>

<div class="header" id="gameHeader" style="display:none">
  <h1>🧠 Memory Game</h1>
</div>

<div class="peek-bar" id="peekBar" style="display:none">
  <div class="peek-bar-fill" id="peekBarFill"></div>
</div>

<div class="stats" id="gameStats" style="display:none">
  <span>⭐ Pairs: <span id="pairsFound">0</span>/<span id="pairsTotal">0</span></span>
  <span>👆 Moves: <span id="moveCount">0</span></span>
</div>

<div class="board" id="board"></div>

<script>
const EMOJIS = [
  '🐶','🐱','🐼','🦁','🐸','🐵','🐔','🐙',
  '🦄','🐝','🐢','🐳','🦋','🐘','🐧','🦊',
  '🐬','🐞','🦀','🐻'
];

// Family photos for Hans!
const CUSTOM_IMAGES = [
  'photos/1.jpg', 'photos/2.jpg', 'photos/3.jpg', 'photos/4.jpg', 'photos/5.jpg',
  'photos/6.jpg', 'photos/7.jpg', 'photos/8.jpg', 'photos/9.jpg', 'photos/10.jpg',
];

const GRID_CONFIGS = {
  4: { cols: 4, rows: 3, pairs: 6, peekTime: 8 },
  6: { cols: 4, rows: 4, pairs: 8, peekTime: 10 },
  8: { cols: 4, rows: 5, pairs: 10, peekTime: 12 },
};

let config = GRID_CONFIGS[4];
let cards = [];
let flippedCards = [];
let matchedPairs = 0;
let moves = 0;
let locked = false;
let peekInterval = null;

// Difficulty buttons
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    config = GRID_CONFIGS[parseInt(btn.dataset.size)];
  });
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('playAgainBtn').addEventListener('click', () => {
  document.getElementById('winScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
});

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameHeader').style.display = '';
  document.getElementById('gameStats').style.display = '';
  document.getElementById('peekBar').style.display = '';

  matchedPairs = 0;
  moves = 0;
  flippedCards = [];
  locked = true;

  document.getElementById('pairsFound').textContent = '0';
  document.getElementById('pairsTotal').textContent = config.pairs;
  document.getElementById('moveCount').textContent = '0';

  // Build card set
  const useImages = CUSTOM_IMAGES.length >= config.pairs;
  const pool = useImages
    ? CUSTOM_IMAGES.slice(0, config.pairs)
    : EMOJIS.slice(0, config.pairs);

  let deck = [...pool, ...pool];
  deck = shuffle(deck);

  const board = document.getElementById('board');
  board.innerHTML = '';
  board.style.gridTemplateColumns = `repeat(${config.cols}, 1fr)`;
  cards = [];

  deck.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card peek';
    card.dataset.index = i;
    card.dataset.value = item;

    const back = document.createElement('div');
    back.className = 'card-face card-back';

    const front = document.createElement('div');
    front.className = 'card-face card-front';
    if (useImages) {
      const img = document.createElement('img');
      img.src = item;
      img.alt = '';
      img.loading = 'eager';
      front.appendChild(img);
    } else {
      front.textContent = item;
    }

    card.appendChild(back);
    card.appendChild(front);
    card.addEventListener('click', () => flipCard(card));
    board.appendChild(card);
    cards.push(card);
  });

  // Peek phase — start blurred, then reveal
  startPeek();
}

function startPeek() {
  const peekOverlay = document.getElementById('peekOverlay');
  const peekBarFill = document.getElementById('peekBarFill');
  const peekTimerEl = document.getElementById('peekTimer');

  // Phase 1: Show blurred for 3 seconds with "Get ready!" overlay
  peekOverlay.classList.remove('hidden');
  peekBarFill.style.width = '100%';
  peekTimerEl.textContent = '👀';

  const blurTime = 3000;
  const revealTime = config.peekTime * 1000;
  const totalMs = blurTime + revealTime;
  const startTime = Date.now();

  peekInterval = setInterval(() => {
    const elapsed = Date.now() - startTime;

    if (elapsed < blurTime) {
      // Phase 1: blurred, countdown to reveal
      const secsLeft = Math.ceil((blurTime - elapsed) / 1000);
      peekTimerEl.textContent = secsLeft;
      peekBarFill.style.width = '100%';
    } else if (elapsed === blurTime || (elapsed > blurTime && !cards[0].classList.contains('peek-clear'))) {
      // Phase 2: unblur! Hide overlay, start memorize countdown
      cards.forEach(c => c.classList.add('peek-clear'));
      peekOverlay.classList.add('hidden');
    }

    if (elapsed >= blurTime) {
      const revealElapsed = elapsed - blurTime;
      const pct = Math.max(0, 1 - revealElapsed / revealTime) * 100;
      peekBarFill.style.width = pct + '%';
      const secsLeft = Math.ceil((revealTime - revealElapsed) / 1000);
      peekTimerEl.textContent = Math.max(0, secsLeft);
    }

    if (elapsed >= totalMs) {
      clearInterval(peekInterval);
      peekOverlay.classList.add('hidden');
      // Flip all cards back
      cards.forEach(c => {
        c.classList.remove('peek');
        c.classList.remove('peek-clear');
      });
      locked = false;
    }
  }, 50);
}

function flipCard(card) {
  if (locked) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (flippedCards.length >= 2) return;

  card.classList.add('flipped');
  flippedCards.push(card);

  if (flippedCards.length === 2) {
    moves++;
    document.getElementById('moveCount').textContent = moves;
    locked = true;

    const [a, b] = flippedCards;
    if (a.dataset.value === b.dataset.value) {
      // Match!
      a.classList.add('matched');
      b.classList.add('matched');
      matchedPairs++;
      document.getElementById('pairsFound').textContent = matchedPairs;
      flippedCards = [];
      locked = false;

      if (matchedPairs === config.pairs) {
        setTimeout(winGame, 600);
      }
    } else {
      // No match — flip back
      setTimeout(() => {
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        flippedCards = [];
        locked = false;
      }, 900);
    }
  }
}

function winGame() {
  const stars = moves <= config.pairs + 2 ? '⭐⭐⭐' : moves <= config.pairs * 2 ? '⭐⭐' : '⭐';
  document.getElementById('winText').textContent =
    `You found all ${config.pairs} pairs in ${moves} moves! ${stars}`;
  document.getElementById('winScreen').classList.remove('hidden');
  launchConfetti();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function launchConfetti() {
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bff','#ffaa5b'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay = Math.random() * 0.5 + 's';
    el.style.width = (8 + Math.random() * 8) + 'px';
    el.style.height = (8 + Math.random() * 8) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}
</script>
</body>
</html>
