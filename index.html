<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hans's Memory Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0f0c29;
  background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 8px;
  overflow-x: hidden;
  -webkit-user-select: none;
  user-select: none;
  color: #fff;
}

/* ---- Header ---- */
.header {
  text-align: center;
  margin-bottom: 8px;
  width: 100%;
}
.header h1 {
  font-size: 26px;
  font-weight: 800;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}

/* ---- Stats ---- */
.stats {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-bottom: 8px;
  font-size: 15px;
  font-weight: 600;
  opacity: 0.85;
}

/* ---- Progress bar ---- */
.peek-bar {
  width: 100%;
  max-width: 600px;
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  margin-bottom: 10px;
  overflow: hidden;
}
.peek-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  border-radius: 3px;
  transition: width 0.1s linear;
}
.peek-bar.hidden { display: none; }

/* ---- Countdown badge (floats over board, not blocking) ---- */
.countdown-badge {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 120px;
  font-weight: 900;
  color: rgba(255,255,255,0.25);
  pointer-events: none;
  z-index: 50;
  text-shadow: 0 0 40px rgba(255,255,255,0.15);
  transition: opacity 0.3s;
}
.countdown-badge.hidden { opacity: 0; }
.countdown-label {
  position: fixed;
  top: calc(50% - 90px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 18px;
  font-weight: 700;
  color: rgba(255,255,255,0.4);
  pointer-events: none;
  z-index: 50;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.countdown-label.hidden { opacity: 0; }

/* ---- Board ---- */
.board {
  display: grid;
  gap: 8px;
  perspective: 1000px;
  width: 100%;
  max-width: 600px;
}

/* ---- Cards ---- */
.card {
  aspect-ratio: 1;
  cursor: pointer;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  -webkit-tap-highlight-color: transparent;
}
.card.flipped { transform: rotateY(180deg); }
.card.matched { transform: rotateY(180deg); }
.card.matched .card-front {
  box-shadow: 0 0 24px rgba(255,215,0,0.5), inset 0 0 0 3px gold;
}
.card.peek { transform: rotateY(180deg); }

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card-back {
  background: linear-gradient(145deg, #667eea 0%, #764ba2 100%);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
  border: 2px solid rgba(255,255,255,0.15);
}
.card-back::after {
  content: '✦';
  font-size: 28px;
  color: rgba(255,255,255,0.25);
}

.card-front {
  background: #1a1a2e;
  transform: rotateY(180deg);
  border: 2px solid rgba(255,255,255,0.1);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.card-front img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 14px;
  transition: filter 0.4s ease;
}

/* Blur states */
.card.peek .card-front img { filter: blur(18px) brightness(0.7); }
.card.peek.peek-clear .card-front img { filter: none; }

/* ---- Start screen ---- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,12,41,0.92);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(12px);
  text-align: center;
  padding: 24px;
}
.overlay.hidden { display: none; }
.overlay h2 { font-size: 56px; margin-bottom: 12px; }
.overlay p { font-size: 18px; opacity: 0.8; margin-bottom: 24px; }

.btn {
  padding: 16px 40px;
  border: none;
  border-radius: 16px;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #1a1a2e;
  box-shadow: 0 6px 24px rgba(247,151,30,0.4);
  transition: transform 0.15s;
  margin: 6px;
  letter-spacing: 0.5px;
}
.btn:active { transform: scale(0.95); }

.difficulty {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 20px;
}
.diff-btn {
  padding: 14px 22px;
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 14px;
  background: rgba(255,255,255,0.08);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.diff-btn:hover, .diff-btn.active {
  background: rgba(247,151,30,0.2);
  border-color: #f7971e;
  color: #ffd200;
}

/* ---- Confetti ---- */
.confetti {
  position: fixed;
  top: -10px;
  border-radius: 3px;
  animation: fall linear forwards;
  z-index: 200;
  pointer-events: none;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ---- Mobile: 3 columns, fill screen ---- */
@media (max-width: 600px) {
  body { padding: 8px 6px; }
  .header h1 { font-size: 22px; }
  .board { gap: 6px; }
  .card-back::after { font-size: 22px; }
  .countdown-badge { font-size: 100px; }
}
</style>
</head>
<body>

<!-- Start Screen -->
<div class="overlay" id="startScreen">
  <h2>🧠</h2>
  <p>Memory Game</p>
  <div class="difficulty">
    <button class="diff-btn active" data-size="4">Easy<br><small>3 × 4</small></button>
    <button class="diff-btn" data-size="6">Medium<br><small>4 × 4</small></button>
    <button class="diff-btn" data-size="8">Hard<br><small>4 × 5</small></button>
  </div>
  <div style="margin-top: 24px">
    <button class="btn" id="startBtn">▶ Play</button>
  </div>
</div>

<!-- Win Screen -->
<div class="overlay hidden" id="winScreen">
  <h2 id="winEmoji">🎉</h2>
  <p id="winText">Amazing!</p>
  <button class="btn" id="playAgainBtn">Play Again</button>
</div>

<div class="header" id="gameHeader" style="display:none">
  <h1>Memory Game</h1>
</div>

<div class="stats" id="gameStats" style="display:none">
  <span>⭐ <span id="pairsFound">0</span>/<span id="pairsTotal">0</span></span>
  <span>👆 <span id="moveCount">0</span></span>
</div>

<div class="peek-bar hidden" id="peekBar"><div class="peek-bar-fill" id="peekBarFill"></div></div>

<div class="countdown-badge hidden" id="countdownBadge"></div>
<div class="countdown-label hidden" id="countdownLabel">MEMORIZE</div>

<div class="board" id="board"></div>

<script>
const CUSTOM_IMAGES = [
  'photos/1.jpg','photos/2.jpg','photos/3.jpg','photos/4.jpg','photos/5.jpg',
  'photos/6.jpg','photos/7.jpg','photos/8.jpg','photos/9.jpg','photos/10.jpg',
];

const EMOJIS = ['🐶','🐱','🐼','🦁','🐸','🐵','🐔','🐙','🦄','🐝','🐢','🐳','🦋','🐘','🐧','🦊','🐬','🐞','🦀','🐻'];

const GRID_CONFIGS = {
  4:  { cols: 3, rows: 4, pairs: 6,  peekTime: 8  },
  6:  { cols: 4, rows: 4, pairs: 8,  peekTime: 10 },
  8:  { cols: 4, rows: 5, pairs: 10, peekTime: 12 },
};

let config = GRID_CONFIGS[4];
let cards = [];
let flippedCards = [];
let matchedPairs = 0;
let moves = 0;
let locked = false;
let peekInterval = null;

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    config = GRID_CONFIGS[parseInt(btn.dataset.size)];
  });
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('playAgainBtn').addEventListener('click', () => {
  document.getElementById('winScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
});

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameHeader').style.display = '';
  document.getElementById('gameStats').style.display = '';

  matchedPairs = 0; moves = 0; flippedCards = []; locked = true;
  document.getElementById('pairsFound').textContent = '0';
  document.getElementById('pairsTotal').textContent = config.pairs;
  document.getElementById('moveCount').textContent = '0';

  const useImages = CUSTOM_IMAGES.length >= config.pairs;
  const pool = useImages ? shuffle(CUSTOM_IMAGES).slice(0, config.pairs) : EMOJIS.slice(0, config.pairs);
  let deck = shuffle([...pool, ...pool]);

  const board = document.getElementById('board');
  board.innerHTML = '';
  board.style.gridTemplateColumns = `repeat(${config.cols}, 1fr)`;
  cards = [];

  deck.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card peek'; // start peeked + blurred
    card.dataset.index = i;
    card.dataset.value = item;

    const back = document.createElement('div');
    back.className = 'card-face card-back';

    const front = document.createElement('div');
    front.className = 'card-face card-front';
    if (useImages) {
      const img = document.createElement('img');
      img.src = item; img.alt = ''; img.loading = 'eager';
      front.appendChild(img);
    } else {
      front.textContent = item;
      front.style.fontSize = '48px';
    }

    card.appendChild(back);
    card.appendChild(front);
    card.addEventListener('click', () => flipCard(card));
    board.appendChild(card);
    cards.push(card);
  });

  startPeek();
}

function startPeek() {
  const peekBar = document.getElementById('peekBar');
  const peekBarFill = document.getElementById('peekBarFill');
  const badge = document.getElementById('countdownBadge');
  const label = document.getElementById('countdownLabel');

  peekBar.classList.remove('hidden');
  peekBarFill.style.width = '100%';

  // Phase 1: blurred cards visible, countdown from 3
  const blurTime = 3000;
  const revealTime = config.peekTime * 1000;
  const startTime = Date.now();

  badge.classList.remove('hidden');
  label.classList.remove('hidden');
  label.textContent = 'GET READY';

  peekInterval = setInterval(() => {
    const elapsed = Date.now() - startTime;

    if (elapsed < blurTime) {
      // Blur phase
      const secsLeft = Math.ceil((blurTime - elapsed) / 1000);
      badge.textContent = secsLeft;
      peekBarFill.style.width = '100%';
    } else {
      // Reveal phase
      if (!cards[0].classList.contains('peek-clear')) {
        cards.forEach(c => c.classList.add('peek-clear'));
        label.textContent = 'MEMORIZE';
      }
      const revealElapsed = elapsed - blurTime;
      const pct = Math.max(0, 1 - revealElapsed / revealTime) * 100;
      peekBarFill.style.width = pct + '%';
      const secsLeft = Math.ceil((revealTime - revealElapsed) / 1000);
      badge.textContent = secsLeft > 0 ? secsLeft : '';

      if (revealElapsed >= revealTime) {
        clearInterval(peekInterval);
        badge.classList.add('hidden');
        label.classList.add('hidden');
        peekBar.classList.add('hidden');
        cards.forEach(c => { c.classList.remove('peek','peek-clear'); });
        locked = false;
      }
    }
  }, 50);
}

function flipCard(card) {
  if (locked) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (flippedCards.length >= 2) return;

  card.classList.add('flipped');
  flippedCards.push(card);

  if (flippedCards.length === 2) {
    moves++;
    document.getElementById('moveCount').textContent = moves;
    locked = true;
    const [a, b] = flippedCards;
    if (a.dataset.value === b.dataset.value) {
      a.classList.add('matched'); b.classList.add('matched');
      matchedPairs++;
      document.getElementById('pairsFound').textContent = matchedPairs;
      flippedCards = []; locked = false;
      if (matchedPairs === config.pairs) setTimeout(winGame, 500);
    } else {
      setTimeout(() => { a.classList.remove('flipped'); b.classList.remove('flipped'); flippedCards = []; locked = false; }, 900);
    }
  }
}

function winGame() {
  const stars = moves <= config.pairs + 2 ? '🌟🌟🌟' : moves <= config.pairs * 2 ? '🌟🌟' : '🌟';
  document.getElementById('winEmoji').textContent = '🎉';
  document.getElementById('winText').textContent = `${config.pairs} pairs in ${moves} moves! ${stars}`;
  document.getElementById('winScreen').classList.remove('hidden');
  launchConfetti();
}

function shuffle(a) { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

function launchConfetti() {
  const colors = ['#f7971e','#ffd200','#667eea','#764ba2','#ff6b6b','#6bcb77'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random()*100+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (1.5+Math.random()*2)+'s';
    el.style.animationDelay = Math.random()*0.8+'s';
    el.style.width = (8+Math.random()*10)+'px';
    el.style.height = (8+Math.random()*10)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4500);
  }
}
</script>
</body>
</html>
